name: Verify NEXORA build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: TypeScript verification
        run: npm run typecheck
      - name: Build Next.js app
        run: npm run build
      - name: Validate production Docker image
        run: docker build -t nexora-ai:ci .
