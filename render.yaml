services:
  - type: web
    name: nexora-ai
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NEXORA_ADMIN_EMAILS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: XAI_MODEL
        sync: false
      - key: COHERE_API_KEY
        sync: false
      - key: COHERE_MODEL
        sync: false
      - key: TOGETHER_API_KEY
        sync: false
      - key: TOGETHER_MODEL
        sync: false
      - key: FIREWORKS_API_KEY
        sync: false
      - key: FIREWORKS_MODEL
        sync: false
      - key: GOOGLE_AI_API_KEY
        sync: false
      - key: STABILITY_API_KEY
        sync: false
      - key: FAL_KEY
        sync: false
      - key: FAL_VIDEO_MODEL
        sync: false
      - key: RUNWAY_API_KEY
        sync: false
      - key: LUMA_API_KEY
        sync: false
      - key: KLING_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_DEFAULT_VOICE_ID
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRO_PRICE_ID
        sync: false
